name: Extract question performance failure details

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extract-question-performance-failure.yml"

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download failed job log tail
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          JOB_ID: "89748518012"
        run: |
          python <<'PY'
          import os
          import urllib.request
          from pathlib import Path

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/jobs/{os.environ['JOB_ID']}/logs",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              content = response.read().decode("utf-8", errors="replace")
          lines = content.splitlines()
          Path('.github/question-optimization-v3-failure.log').write_text(
              "\n".join(lines[-220:]) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit failure details
        run: |
          rm .github/workflows/extract-question-performance-failure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record question performance failure details [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
