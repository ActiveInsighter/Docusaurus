name: Fix documentation optimization runner

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-optimize-runner.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Correct repeated workflow path replacements
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/optimize-doc-performance.yml')
          text = path.read_text(encoding='utf-8')

          old_navbar = '''          visual = replace_once(
              visual,
              '      - "src/theme/Navbar/**"\\n',
              '      - "src/theme/Navbar/**"\\n      - "src/components/Question/**"\\n      - "docs/李正元练习题/**"\\n',
              'extend visual pull request paths',
          )
          visual = replace_once(
              visual,
              '      - "src/theme/Navbar/**"\\n',
              '      - "src/theme/Navbar/**"\\n      - "src/components/Question/**"\\n      - "docs/李正元练习题/**"\\n',
              'extend visual push paths',
          )
          '''
          new_navbar = '''          navbar_path = '      - "src/theme/Navbar/**"\\n'
          if visual.count(navbar_path) != 2:
              raise RuntimeError(
                  f'visual workflow navbar path count changed: {visual.count(navbar_path)}'
              )
          visual = visual.replace(
              navbar_path,
              navbar_path
              + '      - "src/components/Question/**"\\n'
              + '      - "docs/李正元练习题/**"\\n',
              2,
          )
          '''

          old_test = '''          visual = replace_once(
              visual,
              '      - "Py/check_docsearch_visual.py"\\n',
              '      - "Py/check_docsearch_visual.py"\\n      - "Py/check_question_performance.py"\\n',
              'add visual performance pull request path',
          )
          visual = replace_once(
              visual,
              '      - "Py/check_docsearch_visual.py"\\n',
              '      - "Py/check_docsearch_visual.py"\\n      - "Py/check_question_performance.py"\\n',
              'add visual performance push path',
          )
          '''
          new_test = '''          visual_test_path = '      - "Py/check_docsearch_visual.py"\\n'
          if visual.count(visual_test_path) != 2:
              raise RuntimeError(
                  'visual workflow test path count changed: '
                  f'{visual.count(visual_test_path)}'
              )
          visual = visual.replace(
              visual_test_path,
              visual_test_path + '      - "Py/check_question_performance.py"\\n',
              2,
          )
          '''

          if text.count(old_navbar) != 1:
              raise RuntimeError('navbar replacement block not found exactly once')
          if text.count(old_test) != 1:
              raise RuntimeError('test replacement block not found exactly once')

          text = text.replace(old_navbar, new_navbar, 1)
          text = text.replace(old_test, new_test, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit corrected runner
        run: |
          rm .github/workflows/fix-optimize-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: correct documentation optimization runner"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
