name: Build and deploy Docusaurus

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-docusaurus-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  # The Pages project is named "docusaurus". Its generated hostname is
  # docusaurus-d92.pages.dev; the hostname prefix is not the project name.
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'docusaurus' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Test workflow run index
        run: npm run test:workflow-runs

      - name: Build site with resource telemetry
        shell: bash
        run: |
          set -o pipefail

          file_value() {
            local file="$1"
            if [[ -r "${file}" ]]; then
              cat "${file}"
            else
              printf 'na'
            fi
          }

          event_value() {
            local key="$1"
            local file="/sys/fs/cgroup/memory.events"
            if [[ -r "${file}" ]]; then
              awk -v key="${key}" '$1 == key {print $2}' "${file}"
            else
              printf 'na'
            fi
          }

          print_resource_line() {
            local mem_available_kb mem_free_kb
            local cgroup_current cgroup_peak cgroup_max cgroup_high
            local cgroup_oom cgroup_oom_kill cgroup_high_events cgroup_max_events
            local disk_available_kb node_rss_total_kb=0 node_rss_max_kb=0 rss

            mem_available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
            mem_free_kb="$(awk '/MemFree:/ {print $2}' /proc/meminfo)"
            cgroup_current="$(file_value /sys/fs/cgroup/memory.current)"
            cgroup_peak="$(file_value /sys/fs/cgroup/memory.peak)"
            cgroup_max="$(file_value /sys/fs/cgroup/memory.max)"
            cgroup_high="$(file_value /sys/fs/cgroup/memory.high)"
            cgroup_oom="$(event_value oom)"
            cgroup_oom_kill="$(event_value oom_kill)"
            cgroup_high_events="$(event_value high)"
            cgroup_max_events="$(event_value max)"
            disk_available_kb="$(df -Pk . | awk 'NR == 2 {print $4}')"

            while read -r rss; do
              [[ -z "${rss}" ]] && continue
              node_rss_total_kb=$((node_rss_total_kb + rss))
              if ((rss > node_rss_max_kb)); then
                node_rss_max_kb="${rss}"
              fi
            done < <(ps -C node -o rss= 2>/dev/null || true)

            printf 'RESOURCE ts=%s mem_available_kb=%s mem_free_kb=%s cgroup_current_bytes=%s cgroup_peak_bytes=%s cgroup_max=%s cgroup_high=%s cgroup_oom=%s cgroup_oom_kill=%s cgroup_high_events=%s cgroup_max_events=%s node_rss_total_kb=%s node_rss_max_kb=%s disk_available_kb=%s\n' \
              "$(date -Iseconds)" \
              "${mem_available_kb}" \
              "${mem_free_kb}" \
              "${cgroup_current}" \
              "${cgroup_peak}" \
              "${cgroup_max}" \
              "${cgroup_high}" \
              "${cgroup_oom}" \
              "${cgroup_oom_kill}" \
              "${cgroup_high_events}" \
              "${cgroup_max_events}" \
              "${node_rss_total_kb}" \
              "${node_rss_max_kb}" \
              "${disk_available_kb}"
          }

          echo "RESOURCE_META kernel=$(uname -r) logical_cpus=$(nproc)"
          print_resource_line

          (
            while true; do
              sleep 10
              print_resource_line
            done
          ) &
          MONITOR_PID=$!

          cleanup() {
            kill "${MONITOR_PID}" 2>/dev/null || true
            wait "${MONITOR_PID}" 2>/dev/null || true
            print_resource_line || true
          }
          trap cleanup EXIT INT TERM

          /usr/bin/time -v npm run build

      - name: Check Cloudflare authentication
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 whoami

      - name: Check Cloudflare Pages project access
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deployment list
          --project-name="${CLOUDFLARE_PAGES_PROJECT}"
          --environment=production
          --json

      - name: Deploy production to Cloudflare Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy build
          --project-name="${CLOUDFLARE_PAGES_PROJECT}"
          --branch=main
          --commit-hash="${GITHUB_SHA}"
