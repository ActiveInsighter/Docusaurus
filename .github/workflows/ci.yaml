name: Build and deploy Docusaurus

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: build-docusaurus-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  CLOUDFLARE_PAGES_PROJECT: docusaurus-d92
  WORKFLOW_KEY: build
  WORKFLOW_FILE: ci.yaml
  STATE_LOG: .github/workflow-runs/build/latest-log.txt

jobs:
  build:
    if: >-
      github.event_name != 'issues' ||
      (
        github.event.issue.title == 'deploy-production' &&
        github.actor == github.repository_owner
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issues' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Record run start
        run: node scripts/record-workflow-state.mjs start

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "## Install dependencies" | tee -a "$STATE_LOG"
          npm ci --no-audit --no-fund 2>&1 | tee -a "$STATE_LOG"

      - name: Check TypeScript
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "" | tee -a "$STATE_LOG"
          echo "## TypeScript" | tee -a "$STATE_LOG"
          npm run typecheck 2>&1 | tee -a "$STATE_LOG"

      - name: Build site
        id: build
        if: steps.install.outcome == 'success' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "" | tee -a "$STATE_LOG"
          echo "## Docusaurus build" | tee -a "$STATE_LOG"
          npm run build 2>&1 | tee -a "$STATE_LOG"

      - name: Deploy production to Cloudflare Pages
        id: deploy
        if: >-
          steps.build.outcome == 'success' &&
          (
            (
              github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
            ) ||
            (
              github.event_name == 'issues' &&
              github.event.issue.title == 'deploy-production' &&
              github.actor == github.repository_owner
            )
          )
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: >-
            pages deploy build
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Record deployment details
        if: always() && steps.deploy.outcome != 'skipped'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias }}
        run: |
          echo "" | tee -a "$STATE_LOG"
          echo "## Cloudflare Pages deployment" | tee -a "$STATE_LOG"
          echo "project: $CLOUDFLARE_PAGES_PROJECT" | tee -a "$STATE_LOG"
          echo "outcome: ${{ steps.deploy.outcome }}" | tee -a "$STATE_LOG"
          echo "deployment_url: $DEPLOYMENT_URL" | tee -a "$STATE_LOG"
          echo "deployment_alias: $DEPLOYMENT_ALIAS" | tee -a "$STATE_LOG"

      - name: Record run finish
        if: always()
        env:
          STEP_OUTCOMES_JSON: >-
            {"install":"${{ steps.install.outcome }}","typecheck":"${{ steps.typecheck.outcome }}","build":"${{ steps.build.outcome }}","deploy":"${{ steps.deploy.outcome }}"}
        run: node scripts/record-workflow-state.mjs finish

      - name: Commit run state
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || github.event_name == 'issues')
        continue-on-error: true
        run: node scripts/commit-workflow-state.mjs "[CF-Pages-Skip] Record Docusaurus build and deployment result [skip ci]"

      - name: Fail when checks or deployment fail
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_REQUIRED: >-
            ${{
              (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'issues' && github.event.issue.title == 'deploy-production' && github.actor == github.repository_owner)
            }}
        run: |
          if [ "$INSTALL_OUTCOME" != "success" ] \
            || [ "$TYPECHECK_OUTCOME" != "success" ] \
            || [ "$BUILD_OUTCOME" != "success" ]; then
            exit 1
          fi

          if [ "$DEPLOY_REQUIRED" = "true" ] && [ "$DEPLOY_OUTCOME" != "success" ]; then
            exit 1
          fi
