name: Build and deploy Docusaurus

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-docusaurus-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  # The Pages project is named "docusaurus". Its generated hostname is
  # docusaurus-d92.pages.dev; the hostname prefix is not the project name.
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'docusaurus' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Test workflow run index
        run: npm run test:workflow-runs

      - name: Build site with resource telemetry
        shell: bash
        run: |
          set -o pipefail

          print_cgroup_memory() {
            echo "--- cgroup memory ---"
            for name in \
              memory.current \
              memory.peak \
              memory.max \
              memory.high \
              memory.events \
              memory.swap.current \
              memory.swap.max; do
              file="/sys/fs/cgroup/${name}"
              if [[ -r "${file}" ]]; then
                echo "${name}:"
                cat "${file}"
              fi
            done
          }

          print_snapshot() {
            echo "timestamp: $(date -Iseconds)"
            echo "--- system memory ---"
            free -m
            echo "--- workspace disk ---"
            df -h .
            print_cgroup_memory
            echo "--- highest RSS processes ---"
            ps -eo pid,ppid,rss,vsz,%mem,%cpu,etime,comm,args --sort=-rss | head -n 20
          }

          echo "===== initial resource snapshot ====="
          uname -a
          echo "logical CPUs: $(nproc)"
          print_snapshot

          (
            while true; do
              echo "::group::resource snapshot $(date -Iseconds)"
              print_snapshot
              echo "::endgroup::"
              sleep 20
            done
          ) &
          MONITOR_PID=$!

          cleanup() {
            kill "${MONITOR_PID}" 2>/dev/null || true
            wait "${MONITOR_PID}" 2>/dev/null || true
            echo "===== final resource snapshot ====="
            print_snapshot || true
          }
          trap cleanup EXIT INT TERM

          /usr/bin/time -v npm run build

      - name: Check Cloudflare authentication
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 whoami

      - name: Check Cloudflare Pages project access
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deployment list
          --project-name="${CLOUDFLARE_PAGES_PROJECT}"
          --environment=production
          --json

      - name: Deploy production to Cloudflare Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy build
          --project-name="${CLOUDFLARE_PAGES_PROJECT}"
          --branch=main
          --commit-hash="${GITHUB_SHA}"
