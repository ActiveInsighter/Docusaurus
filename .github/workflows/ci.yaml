name: Build and deploy Docusaurus

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: build-docusaurus-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  CLOUDFLARE_PAGES_PROJECT: docusaurus-d92

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Test workflow run index
        run: npm run test:workflow-runs

      - name: Build site
        run: npm run build

      - name: Deploy production to Cloudflare Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: >-
            pages deploy build
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
