name: Build and deploy Docusaurus

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-docusaurus-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  CLOUDFLARE_PAGES_PROJECT: docusaurus-d92

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Test workflow run index
        run: npm run test:workflow-runs

      - name: Build site
        run: npm run build

      - name: Check Cloudflare authentication
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 whoami

      - name: Check Cloudflare Pages project access
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deployment list
          --project-name="${CLOUDFLARE_PAGES_PROJECT}"
          --environment=production
          --json

      - name: Deploy production to Cloudflare Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy build
          --project-name="${CLOUDFLARE_PAGES_PROJECT}"
          --branch=main
          --commit-hash="${GITHUB_SHA}"
