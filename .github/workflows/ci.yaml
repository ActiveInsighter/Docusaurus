name: Build Docusaurus

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflow-runs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docusaurus-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  WORKFLOW_KEY: build
  WORKFLOW_FILE: ci.yaml
  STATE_LOG: .github/workflow-runs/build/latest-log.txt

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Record run start
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/record-workflow-state.mjs start

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "## Install dependencies" | tee -a "$STATE_LOG"
          npm ci --no-audit --no-fund 2>&1 | tee -a "$STATE_LOG"

      - name: Check TypeScript
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "" | tee -a "$STATE_LOG"
          echo "## TypeScript" | tee -a "$STATE_LOG"
          npm run typecheck 2>&1 | tee -a "$STATE_LOG"

      - name: Build site
        id: build
        if: steps.install.outcome == 'success' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "" | tee -a "$STATE_LOG"
          echo "## Docusaurus build" | tee -a "$STATE_LOG"
          npm run build 2>&1 | tee -a "$STATE_LOG"

      - name: Record run finish
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          STEP_OUTCOMES_JSON: >-
            {"install":"${{ steps.install.outcome }}","typecheck":"${{ steps.typecheck.outcome }}","build":"${{ steps.build.outcome }}"}
        run: node scripts/record-workflow-state.mjs finish

      - name: Commit run state
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/commit-workflow-state.mjs "Record Docusaurus build result [skip ci]"

      - name: Fail when checks fail
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [ "$INSTALL_OUTCOME" != "success" ] \
            || [ "$TYPECHECK_OUTCOME" != "success" ] \
            || [ "$BUILD_OUTCOME" != "success" ]; then
            exit 1
          fi
