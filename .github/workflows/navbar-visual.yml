name: Verify navbar visuals

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/css/layout-polish.css"
      - "Py/check_navbar_visual.py"
      - ".github/workflows/navbar-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navbar-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Py/requirements.txt

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check -r Py/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Start built site
        shell: bash
        run: |
          nohup npm run serve -- --host 127.0.0.1 --port 3000 > /tmp/docusaurus-serve.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/docs/overview/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/docusaurus-serve.log
          exit 1

      - name: Capture and assert navbar
        run: >-
          python Py/check_navbar_visual.py
          --base-url http://127.0.0.1:3000
          --output-dir artifacts/navbar-visual

      - name: Upload screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: navbar-visual-${{ github.run_id }}
          path: |
            artifacts/navbar-visual
            /tmp/docusaurus-serve.log
          if-no-files-found: warn
          retention-days: 14
