name: Cloudflare Pages deployment is handled by Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages-note"
  cancel-in-progress: true

jobs:
  note:
    runs-on: ubuntu-22.04
    steps:
      - name: Cloudflare deploys from GitHub
        run: echo "Cloudflare Pages is connected to this repository and deploys automatically on push."
