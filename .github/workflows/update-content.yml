name: Update generated docs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
  push:
    branches:
      - main
    paths:
      - "Py/**"
      - ".github/workflows/update-content.yml"
      - "scripts/record-workflow-state.mjs"
      - "scripts/commit-workflow-state.mjs"

permissions:
  contents: write

concurrency:
  group: update-generated-docs-main
  cancel-in-progress: false

env:
  WORKFLOW_KEY: update-content
  WORKFLOW_FILE: update-content.yml
  STATE_LOG: .github/workflow-runs/update-content/latest-log.txt

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js for workflow state
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Record run start
        run: node scripts/record-workflow-state.mjs start

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Py/requirements.txt

      - name: Install Python dependencies
        id: python_dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "## Install Python dependencies" | tee -a "$STATE_LOG"
          python -m pip install --disable-pip-version-check -r Py/requirements.txt 2>&1 | tee -a "$STATE_LOG"

      - name: Install Chromium for Playwright
        id: chromium
        if: steps.python_dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "" | tee -a "$STATE_LOG"
          echo "## Install Chromium" | tee -a "$STATE_LOG"
          python -m playwright install --with-deps chromium 2>&1 | tee -a "$STATE_LOG"

      - name: Fetch rendered HTML
        id: fetch_html
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "" | tee -a "$STATE_LOG"
          echo "## Fetch rendered HTML" | tee -a "$STATE_LOG"
          python Py/fetch.py --targets-file Py/URL.txt --output-dir HTML --clean-stale --concurrency 5 2>&1 | tee -a "$STATE_LOG"

      - name: Convert HTML to Docusaurus docs
        id: convert_docs
        if: steps.fetch_html.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "" | tee -a "$STATE_LOG"
          echo "## Convert HTML to docs" | tee -a "$STATE_LOG"
          python Py/html_to_md.py --input-dir HTML --output-dir docs/algorithm/programmercarl --targets-file Py/URL.txt --jobs 4 2>&1 | tee -a "$STATE_LOG"

      - name: Group multi-language code tabs
        id: code_tabs
        if: steps.convert_docs.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "" | tee -a "$STATE_LOG"
          echo "## Group code tabs" | tee -a "$STATE_LOG"
          python Py/code_tabs.py --docs-dir docs/algorithm/programmercarl 2>&1 | tee -a "$STATE_LOG"

      - name: Commit generated docs locally
        id: commit_docs
        if: steps.code_tabs.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "" | tee -a "$STATE_LOG"
          echo "## Generated docs changes" | tee -a "$STATE_LOG"
          git status --short -- docs/algorithm/programmercarl | tee -a "$STATE_LOG"

          if [ -z "$(git status --porcelain -- docs/algorithm/programmercarl)" ]; then
            echo "No generated docs changes to commit." | tee -a "$STATE_LOG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/algorithm/programmercarl
          git commit -m "docs: update generated algorithm notes"

      - name: Record run finish
        if: always()
        env:
          STEP_OUTCOMES_JSON: >-
            {"python_dependencies":"${{ steps.python_dependencies.outcome }}","chromium":"${{ steps.chromium.outcome }}","fetch_html":"${{ steps.fetch_html.outcome }}","convert_docs":"${{ steps.convert_docs.outcome }}","code_tabs":"${{ steps.code_tabs.outcome }}","commit_docs":"${{ steps.commit_docs.outcome }}"}
        run: node scripts/record-workflow-state.mjs finish

      - name: Commit run state and push
        if: always()
        continue-on-error: true
        run: node scripts/commit-workflow-state.mjs "[CF-Pages-Skip] Record generated docs result [skip ci]"

      - name: Fail when update steps fail
        if: always()
        env:
          PYTHON_DEPENDENCIES_OUTCOME: ${{ steps.python_dependencies.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          FETCH_HTML_OUTCOME: ${{ steps.fetch_html.outcome }}
          CONVERT_DOCS_OUTCOME: ${{ steps.convert_docs.outcome }}
          CODE_TABS_OUTCOME: ${{ steps.code_tabs.outcome }}
          COMMIT_DOCS_OUTCOME: ${{ steps.commit_docs.outcome }}
        run: |
          if [ "$PYTHON_DEPENDENCIES_OUTCOME" != "success" ] \
            || [ "$CHROMIUM_OUTCOME" != "success" ] \
            || [ "$FETCH_HTML_OUTCOME" != "success" ] \
            || [ "$CONVERT_DOCS_OUTCOME" != "success" ] \
            || [ "$CODE_TABS_OUTCOME" != "success" ] \
            || [ "$COMMIT_DOCS_OUTCOME" != "success" ]; then
            exit 1
          fi
