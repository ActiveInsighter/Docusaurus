name: Inspect question optimization v3 run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-question-optimization-v3.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read optimization workflow state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const workflow = 'apply-question-performance-optimization-v2.yml';
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GH_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=5`,
            {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            },
          );
          const body = await response.text();
          if (!response.ok) throw new Error(`${response.status}: ${body}`);
          const payload = JSON.parse(body);
          const runs = payload.workflow_runs.map((run) => ({
            id: run.id,
            run_number: run.run_number,
            name: run.name,
            status: run.status,
            conclusion: run.conclusion,
            head_sha: run.head_sha,
            created_at: run.created_at,
            updated_at: run.updated_at,
            html_url: run.html_url,
          }));
          await writeFile(
            '.github/question-optimization-v3-run.json',
            `${JSON.stringify(runs, null, 2)}\n`,
            'utf8',
          );
          NODE

      - name: Commit state snapshot
        run: |
          rm .github/workflows/inspect-question-optimization-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record question optimization v3 run [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
