name: Diagnose build resources

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/resource-diagnose.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/diagnostics/resource-telemetry-pr.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Run compact monitored build
        shell: bash
        run: >-
          git clone --depth 1 --branch main
          https://github.com/ActiveInsighter/Docusaurus.git repo >/dev/null 2>&1 &&
          cd repo &&
          bash scripts/diagnose-build-resources.sh
