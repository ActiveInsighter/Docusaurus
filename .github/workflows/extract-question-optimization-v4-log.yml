name: Extract question optimization v4 failure log

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extract-question-optimization-v4-log.yml"

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download failed job log tail
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          JOB_ID: "89749259961"
        run: |
          gh api "repos/${GH_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > /tmp/job.log
          tail -n 170 /tmp/job.log > .github/question-optimization-v4-failure.log
      - name: Commit failure details
        run: |
          rm .github/workflows/extract-question-optimization-v4-log.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record question optimization v4 failure [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
