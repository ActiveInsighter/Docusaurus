name: Inspect failure log extractor run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-extractor-run.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read extractor workflow state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const workflow = 'extract-question-performance-failure.yml';
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GH_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=3`,
            {headers: {Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28'}},
          );
          const body = await response.text();
          if (!response.ok) throw new Error(`${response.status}: ${body}`);
          const payload = JSON.parse(body);
          await writeFile('.github/extractor-run.json', JSON.stringify(payload.workflow_runs.map((run) => ({id: run.id, status: run.status, conclusion: run.conclusion, head_sha: run.head_sha, html_url: run.html_url})), null, 2) + '\n');
          NODE
      - name: Commit snapshot
        run: |
          rm .github/workflows/inspect-extractor-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record extractor run [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
