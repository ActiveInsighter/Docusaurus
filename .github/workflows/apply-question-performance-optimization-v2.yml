name: Apply verified question performance optimization v3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-question-performance-optimization-v2.yml"

permissions:
  contents: write

env:
  NODE_VERSION: 24
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'docusaurus' }}

jobs:
  optimize:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Py/requirements.txt

      - name: Apply optimized implementation
        run: |
          node scripts/apply-question-performance-optimization.mjs
          node scripts/update-layout-visual-assertions.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source and production build
        run: |
          npm run typecheck
          npm run check:lzy
          npm run check:question-performance
          npm run test:workflow-runs
          npm run build

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check -r Py/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Start built site
        shell: bash
        run: |
          nohup npm run serve -- --host 127.0.0.1 --port 3000 > /tmp/docusaurus-serve.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/docs/overview/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/docusaurus-serve.log
          exit 1

      - name: Verify layout and long question pages
        run: |
          python Py/check_navbar_visual.py \
            --base-url http://127.0.0.1:3000 \
            --output-dir artifacts/docs-ui-visual
          python Py/check_question_performance.py \
            --base-url http://127.0.0.1:3000 \
            --output-dir artifacts/docs-ui-visual

      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-question-performance-optimization.yml
          rm -f .github/workflows/apply-question-performance-optimization-v2.yml
          rm -f .github/workflows/optimize-doc-performance.yml
          rm -f .github/workflows/fix-optimize-runner.yml
          rm -f .github/question-optimization-run.json
          rm -f .github/question-optimization-v2-run.json
          rm -f .github/temp-run-status.json
          rm -f scripts/apply-question-performance-optimization.mjs
          rm -f scripts/update-layout-visual-assertions.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: optimize long question pages and stabilize sidebar"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Deploy production to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy build
          --project-name="${CLOUDFLARE_PAGES_PROJECT}"
          --branch=main
          --commit-hash="$(git rev-parse HEAD)"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-question-performance-v3-${{ github.run_id }}
          path: |
            artifacts/docs-ui-visual
            /tmp/docusaurus-serve.log
          if-no-files-found: warn
          retention-days: 14
